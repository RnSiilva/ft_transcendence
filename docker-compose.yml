services:
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: on-failure
    networks:
      - ft_network
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: on-failure
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - ft_network
    expose:
      - "4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run dev" # synchronization and creation of tables

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: on-failure
    depends_on:
      - backend
    networks:
      - ft_network
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
  
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: on-failure
    depends_on:
      - frontend
      - backend
    networks:
      - ft_network
    ports:
      - "${HTTPS_PORT:-443}:443" # NEW: added a .env variable to allow running on 42 computers
      - "${HTTP_PORT:-80}:80" # NEW: added a .env variable to allow running on 42 computers
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  ft_network:

volumes:
  mariadb_data:
  backend_node_modules:
  frontend_node_modules:
