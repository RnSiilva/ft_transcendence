services:
  mariadb:
    build:
      context: ./mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: on-failure
    networks:
      - ft_network
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: on-failure
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - ft_network
    expose:
      - "4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: on-failure
    depends_on:
      - backend
    networks:
      - ft_network
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
  
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: on-failure
    depends_on:
      - frontend
      - backend
    networks:
      - ft_network
    ports:
      - "8443:443" # changed from 443 to 8443 to make it accessible on 42 school network, since it blocks ports under 1024
      - "8080:80"  # changed from 80 to 8080 to make it accessible on 42 school network, since it blocks ports under 1024
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  ft_network:

volumes:
  mariadb_data:
  backend_node_modules:
  frontend_node_modules:
